plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }
dependencies { implementation 'org.ow2.asm:asm:9.7.1' }
jar {
    archiveFileName = 'jogger_touch_agent.jar'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class'
    manifest { attributes('Manifest-Version':'1.0', 'Premain-Class':'com.minecraftjogger.touch.JoggerTouchAgent', 'Can-Redefine-Classes':'false', 'Can-Retransform-Classes':'false', 'Implementation-Title':'Minecraft Jogger Classic Touch Agent', 'Implementation-Version':'1.1.0') }
}
tasks.register('verifyTouchProtocol', JavaExec) { dependsOn testClasses; classpath=sourceSets.test.runtimeClasspath; mainClass='com.minecraftjogger.touch.InputStateTest' }
