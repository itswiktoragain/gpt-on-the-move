set timeout=2
set default=0
insmod all_video
set gfxmode=1024x768x32,800x600x32,800x600x16,640x480x32,auto
set gfxpayload=keep
menuentry "Windows 2000 Professional - 64-bit kernel research" {
    set gfxpayload=keep
    multiboot2 /boot/w2k64.elf
    module2 /boot/hello.com DOS16_EXPERIMENT
    boot
}
menuentry "Safe VGA text boot (legacy BIOS only)" {
    set gfxpayload=text
    multiboot2 /boot/w2k64.elf
    module2 /boot/hello.com DOS16_EXPERIMENT
    boot
}
