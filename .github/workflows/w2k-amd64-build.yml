name: Native W2K AMD64 research kernel ISO

on:
  push:
    branches: [main]
    paths:
      - "w2k-amd64/**"
      - ".github/workflows/w2k-amd64-build.yml"
  workflow_dispatch:

concurrency:
  group: w2k-amd64-main-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-boot-test-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils nasm make grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86 ovmf python3
      - name: Build the actual native AMD64 ISO
        run: make -C w2k-amd64 all
      - name: Unit test DOS16 and PE32/PE32+ support
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror w2k-amd64/tests/unit.c \
            w2k-amd64/src/dos16.c w2k-amd64/src/pe.c \
            -o w2k-amd64/build/unit-test
          w2k-amd64/build/unit-test
      - name: Boot the ISO in QEMU and verify AMD64 serial markers
        run: bash w2k-amd64/tests/boot_smoke.sh
      - name: VMware SVGA framebuffer visibility (BIOS and UEFI)
        run: python3 w2k-amd64/tests/vmware_graphics_test.py
      - name: Keep VMware boot diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vmware-bios-uefi-diagnostics
          path: |
            w2k-amd64/build/eltorito.txt
            w2k-amd64/build/vmware-probe/*.serial.log
            w2k-amd64/build/vmware-probe/*.qemu-stderr.txt
            w2k-amd64/build/vmware-probe/*.ppm
          if-no-files-found: warn
      - name: Upload tested ISO as an Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: w2k-amd64-native-kernel-preview
          path: |
            w2k-amd64/build/w2k64-amd64.iso
            w2k-amd64/build/qemu-serial.log
            w2k-amd64/build/vmware-probe/*.ppm
            w2k-amd64/build/vmware-probe/*.serial.log
          if-no-files-found: error
      - name: Publish boot-verified public GitHub pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=w2k64-amd64-bootstrap
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Native AMD64 kernel experiment (not NT 5.0)" \
              --notes "QEMU-tested native 64-bit kernel prototype, NOT a complete Microsoft Windows 2000 x64 port. No XP core. WOW64 and Win16 Windows apps are not implemented. See README." \
              --prerelease
          fi
          gh release upload "$tag" w2k-amd64/build/w2k64-amd64.iso --clobber
          gh release upload "$tag" w2k-amd64/build/qemu-serial.log --clobber
