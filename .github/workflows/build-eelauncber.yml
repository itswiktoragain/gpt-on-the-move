name: Build Eelauncber APK

on:
  push:
    branches:
      - eelauncber-apk
    paths:
      - 'Eelauncber/**'
      - '.github/workflows/build-eelauncber.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform from runner SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Eelauncber
        run: gradle -p Eelauncber --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -s Eelauncber/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Eelauncber/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.eelauncber.launcher'"
      - name: Publish installable APK
        run: |
          cp Eelauncber/app/build/outputs/apk/debug/app-debug.apk Eelauncber/Eelauncber.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Eelauncber/Eelauncber.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Eelauncber APK [skip ci]"
            git push origin HEAD:eelauncber-apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Eelauncber-Android-APK
          path: Eelauncber/Eelauncber.apk
          if-no-files-found: error
