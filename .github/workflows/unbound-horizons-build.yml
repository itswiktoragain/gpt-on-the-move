name: Unbound Horizons Fabric 1.21.4 JAR
on:
  push:
    branches: [build/unbound-horizons-1.21.4]
    paths:
      - 'unbound-horizons/**'
      - '.github/workflows/unbound-horizons-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build remapped Fabric mod
        working-directory: unbound-horizons
        run: gradle build --no-daemon --stacktrace
      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unboundhorizons-1.21.4
          path: unbound-horizons/build/libs/unboundhorizons-0.1.0.jar
          if-no-files-found: error
      - name: Put built JAR on the build branch for direct download
        run: |
          mkdir -p unbound-horizons/dist
          cp unbound-horizons/build/libs/unboundhorizons-0.1.0.jar unbound-horizons/dist/unboundhorizons-0.1.0.jar
          git config user.name 'GitHub Actions'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f unbound-horizons/dist/unboundhorizons-0.1.0.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Build Unbound Horizons 1.21.4 JAR [skip ci]'
            git push
          fi
