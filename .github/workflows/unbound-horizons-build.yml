name: Unbound Horizons Fabric 1.21.4 JAR
on:
  push:
    branches: [build/unbound-horizons-1.21.4]
    paths:
      - 'unbound-horizons/**'
      - '.github/workflows/unbound-horizons-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build remapped Fabric mod
        working-directory: unbound-horizons
        run: gradle build --no-daemon --stacktrace
      - name: Smoke-test dedicated server and world startup
        working-directory: unbound-horizons
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPS'
          max-players=1
          view-distance=3
          simulation-distance=3
          level-type=minecraft:flat
          generate-structures=false
          online-mode=false
          spawn-protection=0
          PROPS
          set +e
          timeout --signal=INT --kill-after=10s 150s gradle runServer --no-daemon --console=plain > /tmp/unboundhorizons-server-smoke.log 2>&1
          status=$?
          set -e
          echo "Server runner exit status: $status"
          tail -n 180 /tmp/unboundhorizons-server-smoke.log
          if ! grep -Eq 'Done \([0-9.,]+s\)!' /tmp/unboundhorizons-server-smoke.log; then
            echo "::error::Server never reached world-ready state. Refusing to publish JAR."
            exit 1
          fi
          echo "World startup passed."
      - name: Upload tested JAR
        uses: actions/upload-artifact@v4
        with:
          name: unboundhorizons-1.21.4-v0.2.0
          path: unbound-horizons/build/libs/unboundhorizons-0.2.0.jar
          if-no-files-found: error
      - name: Publish tested JAR to branch
        run: |
          mkdir -p unbound-horizons/dist
          cp unbound-horizons/build/libs/unboundhorizons-0.2.0.jar unbound-horizons/dist/unboundhorizons-0.2.0.jar
          git config user.name 'GitHub Actions'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f unbound-horizons/dist/unboundhorizons-0.2.0.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested 0.2.0 JAR [skip ci]'
            git push
          fi
