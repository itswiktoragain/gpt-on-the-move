name: Unbound Horizons Fabric 1.21.4 JAR
on:
  push:
    branches: [build/unbound-horizons-1.21.4]
    paths:
      - 'unbound-horizons/**'
      - '.github/workflows/unbound-horizons-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build remapped Fabric mod
        working-directory: unbound-horizons
        run: gradle build --no-daemon --stacktrace
      - name: Smoke-test actual overworld noise generation down to Y=-480
        working-directory: unbound-horizons
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPS'
          max-players=1
          view-distance=2
          simulation-distance=2
          level-type=minecraft:normal
          generate-structures=false
          online-mode=false
          spawn-protection=0
          PROPS
          set +e
          JAVA_TOOL_OPTIONS="-Dunboundhorizons.verifyTerrain=true" timeout --signal=INT --kill-after=10s 240s gradle runServer --no-daemon --console=plain > /tmp/unboundhorizons-generation-smoke.log 2>&1
          status=$?
          set -e
          echo "Server runner exit status: $status"
          tail -n 190 /tmp/unboundhorizons-generation-smoke.log
          if ! grep -q 'UNBOUND_TERRAIN_CHECK_PASS' /tmp/unboundhorizons-generation-smoke.log; then
            echo "::error::No generated rock at extended Y depths; refusing to publish JAR."
            exit 1
          fi
          if ! grep -Eq 'Done \([0-9.,]+s\)!' /tmp/unboundhorizons-generation-smoke.log; then
            echo "::error::Minecraft did not reach world-ready state; refusing to publish JAR."
            exit 1
          fi
          echo "Overworld noise-generated blocks and server world startup verified."
      - name: Upload tested JAR
        uses: actions/upload-artifact@v4
        with:
          name: unboundhorizons-1.21.4-v0.2.1
          path: unbound-horizons/build/libs/unboundhorizons-0.2.1.jar
          if-no-files-found: error
      - name: Publish tested JAR to branch
        run: |
          mkdir -p unbound-horizons/dist
          cp unbound-horizons/build/libs/unboundhorizons-0.2.1.jar unbound-horizons/dist/unboundhorizons-0.2.1.jar
          git config user.name 'GitHub Actions'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f unbound-horizons/dist/unboundhorizons-0.2.1.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Publish terrain-verified 0.2.1 JAR [skip ci]'
            git pull --rebase origin build/unbound-horizons-1.21.4
            git push
          fi
