name: Build Jogger Classic APK
on:
  push:
    branches: [minecraft-jogger-classic]
    paths: ['minecraft-jogger/**', '.github/workflows/build-minecraft-jogger-classic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jogger-classic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-36.1' 'build-tools;37.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Restore original engine and apply classic update
        run: |
          git clone --no-checkout https://github.com/AngelAuraMC/Amethyst-Android.git jogger-source
          git -C jogger-source checkout --detach 28d6e12d68121b7dd75f2e841058a6b7cdfe4a29
          git -C jogger-source config submodule.androidnsbypass.url https://github.com/alexytomi/androidnsbypass.git
          git -C jogger-source submodule update --init --recursive
          cp -a minecraft-jogger/overlay/. jogger-source/
          python3 minecraft-jogger/classic-integrate.py jogger-source
          python3 minecraft-jogger/fov-hotfix.py jogger-source
          python3 jogger-source/scripts/jogger-prepare.py
          (cd jogger-source && bash scripts/languagelist_updater.sh)
      - name: Test gestures, input ownership and touch projection
        working-directory: jogger-source
        run: |
          mkdir -p classic-test
          javac -d classic-test app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicLogic.java scripts/tests/ClassicLogicTest.java jogger_touch_agent/src/main/java/com/minecraftjogger/touch/TouchRay.java scripts/tests/TouchRayTest.java
          java -cp classic-test ClassicLogicTest
          java -cp classic-test TouchRayTest
      - name: Prepare private signing identity
        env:
          SAVED_KEY: ${{ secrets.JOGGER_CLASSIC_KEYSTORE_BASE64 }}
          SAVED_PASSWORD: ${{ secrets.JOGGER_CLASSIC_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/jogger-signing"
          chmod 700 "$RUNNER_TEMP/jogger-signing"
          export JOGGER_KEYSTORE="$RUNNER_TEMP/jogger-signing/classic.p12"
          if [ -n "$SAVED_KEY" ] && [ -n "$SAVED_PASSWORD" ]; then
            printf '%s' "$SAVED_KEY" | base64 --decode > "$JOGGER_KEYSTORE"
            export JOGGER_KEYSTORE_PASSWORD="$SAVED_PASSWORD"
          else
            export JOGGER_KEYSTORE_PASSWORD="$(openssl rand -base64 36)"
            echo "::add-mask::$JOGGER_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$JOGGER_KEYSTORE" -storetype PKCS12 -storepass:env JOGGER_KEYSTORE_PASSWORD -keypass:env JOGGER_KEYSTORE_PASSWORD -alias jogger -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Minecraft Jogger Classic Fixed, O=Jogger, C=PL'
          fi
          echo "JOGGER_KEYSTORE=$JOGGER_KEYSTORE" >> "$GITHUB_ENV"
          echo "JOGGER_KEYSTORE_PASSWORD=$JOGGER_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build release and test bundled agent
        working-directory: jogger-source
        run: |
          gradle --no-daemon --console=plain --max-workers=3 :app_pojavlauncher:assembleRelease :jogger_touch_agent:verifyTouchProtocol
          python3 jogger_touch_agent/tests/agent_socket_test.py "$JAVA_HOME/bin/java" app_pojavlauncher/src/main/assets/components/jogger_touch_agent/jogger_touch_agent.jar jogger_touch_agent/build/classes/java/test
          javac -cp app_pojavlauncher/src/main/assets/components/jogger_touch_agent/jogger_touch_agent.jar -d classic-test scripts/tests/FovFrameRegression.java
          java -Xverify:all -cp classic-test:app_pojavlauncher/src/main/assets/components/jogger_touch_agent/jogger_touch_agent.jar FovFrameRegression
      - name: Verify finished APK
        run: |
          mkdir -p out
          cp jogger-source/app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/Minecraft-Jogger-1.1.1-Classic-Fixed.apk
          cp jogger-source/app_pojavlauncher/src/main/assets/components/jogger_touch_agent/jogger_touch_agent.jar out/Minecraft-Jogger-Classic-Touch-Agent.jar
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs out/Minecraft-Jogger-1.1.1-Classic-Fixed.apk > out/signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging out/Minecraft-Jogger-1.1.1-Classic-Fixed.apk > out/apk-info.txt
          printf '%s\n' '1.1.1 fixes the FOV local-variable VerifyError. Separate package: com.wiktor.minecraftjogger.classic.repaired. Does not update or delete an existing Classic install. For existing data use the in-place repair JAR.' > out/HOTFIX.txt
          cd out && sha256sum *.apk *.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Jogger-Classic-Fixed-APK
          path: out/
          retention-days: 90
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/jogger-signing"
