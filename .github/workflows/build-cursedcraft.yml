name: Build CursedCraft
on:
  push:
    branches: [cursedcraft-1214]
    paths:
      - 'cursedcraft/**'
      - '.github/workflows/build-cursedcraft.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle --no-daemon --stacktrace build
        working-directory: cursedcraft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursedcraft-build
          path: cursedcraft/build/libs/*.jar
          if-no-files-found: warn
