name: Build Jogger Mobile 1.6.2 (continuous mining + aligned pixel arrows)
on:
  push:
    branches: [minecraft-jogger-mobile]
    paths: ['minecraft-jogger/repair162/**', '.github/workflows/build-minecraft-jogger-1.6.2.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jogger-mobile162-mining-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: sdkmanager 'platforms;android-37.0' 'platforms;android-36.1' 'build-tools;37.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Reconstruct pinned engine and apply Mobile 1.4
        run: |
          git clone --no-checkout https://github.com/AngelAuraMC/Amethyst-Android.git jogger-source
          git -C jogger-source checkout --detach 28d6e12d68121b7dd75f2e841058a6b7cdfe4a29
          git -C jogger-source config submodule.androidnsbypass.url https://github.com/alexytomi/androidnsbypass.git
          git -C jogger-source submodule update --init --recursive
          cp -a minecraft-jogger/overlay/. jogger-source/
          python3 minecraft-jogger/classic-integrate.py jogger-source
          python3 minecraft-jogger/mobile/apply.py jogger-source
          python3 minecraft-jogger/keyboard-icons/apply.py jogger-source
          python3 minecraft-jogger/inventory-ux/apply.py jogger-source
          python3 minecraft-jogger/mobile-1.5/apply.py jogger-source
          python3 minecraft-jogger/orientation-1.5.1/apply.py jogger-source
          python3 minecraft-jogger/mobile-1.5.2/apply.py jogger-source
          mkdir -p out
          cp jogger-source/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicOverlay.java out/baseline152-ClassicOverlay.java
          (cd jogger-source && sha256sum app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicLogic.java app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/InventoryTouch.java jogger_touch_agent/src/main/java/com/minecraftjogger/touch/ClassicGameHooks.java jogger_touch_agent/src/main/java/com/minecraftjogger/touch/TouchRay.java jogger_touch_agent/src/main/java/com/minecraftjogger/touch/MobileTransformer.java) > out/baseline152-controls.sha256
          # NO 1.5.3-1.5.8 controls patches are applied.
          python3 minecraft-jogger/rollback152-ui/apply.py jogger-source
          (cd jogger-source && sha256sum -c ../out/baseline152-controls.sha256)
          python3 - <<'VERIFY_ROLLBACK'
          from pathlib import Path
          before=Path("out/baseline152-ClassicOverlay.java").read_text()
          after=Path("jogger-source/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicOverlay.java").read_text()
          expected=before.replace("float controlsTop=playing()?top+dp(44):top;","float controlsTop=top+dp(2);")
          assert before!=expected and expected==after, "Touch overlay differs from 1.5.2 beyond upper button Y"
          print("Verified: 1.5.2 touch controls preserved byte for byte")
          VERIFY_ROLLBACK
          python3 minecraft-jogger/repair160/apply.py jogger-source
          python3 minecraft-jogger/repair161/apply.py jogger-source
          python3 minecraft-jogger/repair162/apply.py jogger-source
          python3 jogger-source/scripts/jogger-prepare.py
          (cd jogger-source && bash scripts/languagelist_updater.sh)
      - name: Test tap-only focus, inventory actions, stack charge, pixel glyphs, vault and gestures
        working-directory: jogger-source
        run: |
          set -euo pipefail
          mkdir -p mobile-test ../out
          gradle --no-daemon --console=plain --max-workers=3 :jogger_touch_agent:classes
          javac --release 8 -cp jogger_touch_agent/build/classes/java/main -d mobile-test \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/KeyboardState.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/KeyboardViewport.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/PixelGlyphMetrics.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/StackCharge.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/VaultCrypto.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicLogic.java \
            app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/MappingCatalog.java scripts/inventory-tests/*.java scripts/mobile15-tests/*.java scripts/mobile-tests/VaultTest.java scripts/tests/ClassicLogicTest.java
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main GestureRegression | tee ../out/regression.txt
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main TextInputTapTest | tee -a ../out/regression.txt
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main com.minecraftjogger.touch.InventoryActionsTest | tee -a ../out/regression.txt
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main HitClassificationRegression | tee -a ../out/regression.txt
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main com.minecraftjogger.touch.EditableTapRegression | tee -a ../out/regression.txt
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main TouchActionRegression | tee -a ../out/regression.txt
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main VaultTest | tee -a ../out/regression.txt
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main ClassicLogicTest | tee -a ../out/regression.txt
          javac --release 8 -d mobile-test app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/RenderSurfacePolicy.java ../minecraft-jogger/orientation-1.5.1/RenderSurfacePolicyTest.java
          java -cp mobile-test RenderSurfacePolicyTest | tee -a ../out/regression.txt
          javac --release 8 -cp jogger_touch_agent/build/classes/java/main -d mobile-test jogger_touch_agent/src/main/java/com/minecraftjogger/touch/HudLayout.java scripts/mobile16-tests/HudLayoutTest.java
          java -cp mobile-test HudLayoutTest | tee -a ../out/regression.txt
          javac --release 8 -d mobile-test app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/UiMappingFilter.java ../minecraft-jogger/rollback152-ui/UiMappingFilterTest.java
          java -cp mobile-test UiMappingFilterTest | tee -a ../out/regression.txt
          javac --release 8 -cp jogger_touch_agent/build/classes/java/main -d mobile-test ../minecraft-jogger/rollback152-ui/WorldSearchFocusTest.java ../minecraft-jogger/rollback152-ui/HudRuntimeTest.java
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main com.minecraftjogger.touch.WorldSearchFocusTest | tee -a ../out/regression.txt
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main com.minecraftjogger.touch.HudRuntimeTest | tee -a ../out/regression.txt
          javac --release 8 -cp mobile-test -d mobile-test app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/GameTouchMappings.java ../minecraft-jogger/repair160/MiningMappingTest.java
          java -cp mobile-test MiningMappingTest app_pojavlauncher/src/main/assets/jogger-ui-only-1.21.4.properties | tee -a ../out/regression.txt
          javac --release 8 -d mobile-test app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicTopBarLayout.java ../minecraft-jogger/keyboard-button-1.5.4/KeyboardButtonLayoutTest.java
          java -cp mobile-test KeyboardButtonLayoutTest | tee -a ../out/regression.txt
          javac --release 8 -cp mobile-test:jogger_touch_agent/build/classes/java/main -d mobile-test ../minecraft-jogger/repair160/RestoredControlsTest.java
          java -cp mobile-test:jogger_touch_agent/build/classes/java/main RestoredControlsTest app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicOverlay.java app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/mobile/MinecraftKeyboard.java | tee -a ../out/regression.txt
          javac --release 8 -cp mobile-test -d mobile-test app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/MouseAckPolicy.java app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/PixelDiagonalIcons.java ../minecraft-jogger/repair161/ReleaseAndPixelTest.java
          java -cp mobile-test ReleaseAndPixelTest | tee -a ../out/regression.txt
          javac --release 8 -d mobile-test ../minecraft-jogger/repair161/ReleaseRoutingSourceTest.java
          java -cp mobile-test ReleaseRoutingSourceTest app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicOverlay.java app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/JoggerTouchBridge.java | tee -a ../out/regression.txt
          javac --release 11 -cp mobile-test -d mobile-test app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/MiningLookPolicy.java app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/PixelDirectionIcons.java ../minecraft-jogger/repair162/MiningLookAndIconsTest.java
          java -cp mobile-test MiningLookAndIconsTest app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/classic/ClassicOverlay.java | tee -a ../out/regression.txt
          grep -q '^class.edit=fpd$' app_pojavlauncher/src/main/assets/jogger-ui-only-1.21.4.properties
          grep -q '^method.hud.health=b$' app_pojavlauncher/src/main/assets/jogger-ui-only-1.21.4.properties
          grep -Fq 'File mapping = net.kdt.pojavlaunch.jogger.mobile.UiMapping.mappings(context);' app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/jogger/JoggerTouchBridge.java
      - name: Prepare temporary build signing
        run: |
          mkdir -p "$RUNNER_TEMP/jogger-signing"
          chmod 700 "$RUNNER_TEMP/jogger-signing"
          export JOGGER_KEYSTORE="$RUNNER_TEMP/jogger-signing/build.p12"
          export JOGGER_KEYSTORE_PASSWORD="$(openssl rand -base64 36)"
          echo "::add-mask::$JOGGER_KEYSTORE_PASSWORD"
          keytool -genkeypair -keystore "$JOGGER_KEYSTORE" -storetype PKCS12 -storepass:env JOGGER_KEYSTORE_PASSWORD -keypass:env JOGGER_KEYSTORE_PASSWORD -alias jogger -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Jogger CI intermediate, O=Jogger, C=PL'
          echo "JOGGER_KEYSTORE=$JOGGER_KEYSTORE" >> "$GITHUB_ENV"
          echo "JOGGER_KEYSTORE_PASSWORD=$JOGGER_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo 'CI artifact uses a temporary key. Delivery is re-signed locally with the retained 1.2 key; private signing material is never uploaded.' > out/SIGNING.txt
      - name: Build release and exercise packaged agent
        working-directory: jogger-source
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain --max-workers=3 :app_pojavlauncher:assembleRelease :jogger_touch_agent:verifyTouchProtocol
          AGENT=app_pojavlauncher/src/main/assets/components/jogger_touch_agent/jogger_touch_agent.jar
          python3 jogger_touch_agent/tests/agent_socket_test.py "$JAVA_HOME/bin/java" "$AGENT" jogger_touch_agent/build/classes/java/test | tee -a ../out/keyboard-tests.txt
          mkdir -p mobile-test-source
          sed 's/org.objectweb.asm/com.minecraftjogger.internal.asm/g' scripts/tests/FovFrameRegression.java > mobile-test-source/FovFrameRegression.java
          javac -cp "$AGENT" -d mobile-test mobile-test-source/FovFrameRegression.java
          java -Xverify:all -cp "mobile-test:$AGENT" FovFrameRegression | tee -a ../out/keyboard-tests.txt
          mkdir -p mobile-ray-fixture mobile-ray-tests
          javac --release 8 -d mobile-ray-fixture ../minecraft-jogger/pixel-target-1.5.8/fixture/*.java
          javac --release 8 -cp "$AGENT" -d mobile-ray-tests ../minecraft-jogger/pixel-target-1.5.8/FingerBlockPickingTest.java
          java -Xverify:all -cp "mobile-ray-tests:$AGENT" FingerBlockPickingTest mobile-ray-fixture | tee ../out/finger-block-picking-tests.txt
      - name: Verify and package APK
        run: |
          cp jogger-source/app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/Minecraft-Jogger-1.6.2-Mobile-CI.apk
          cp jogger-source/app_pojavlauncher/src/main/assets/components/jogger_touch_agent/jogger_touch_agent.jar out/Minecraft-Jogger-1.6.2-Touch-Agent.jar
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs out/Minecraft-Jogger-1.6.2-Mobile-CI.apk > out/signature-ci.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging out/Minecraft-Jogger-1.6.2-Mobile-CI.apk > out/apk-info.txt
          cp minecraft-jogger/mobile-1.5/mobile15.patch out/
          cp minecraft-jogger/orientation-1.5.1/RenderSurfacePolicy.java out/
          cp minecraft-jogger/orientation-1.5.1/apply.py out/orientation-repair-source.py
          cp minecraft-jogger/mobile-1.5.2/mobile152.patch out/
          cp minecraft-jogger/rollback152-ui/apply.py out/rollback152-ui-apply.py
          cp minecraft-jogger/rollback152-ui/UiMappingFilter.java out/
          cp minecraft-jogger/repair160/apply.py out/repair160-apply.py
          cp minecraft-jogger/repair160/GameTouchMappings.java out/
          cp minecraft-jogger/repair160/RestoredControlsTest.java out/
          cp minecraft-jogger/repair161/apply.py out/repair161-apply.py
          cp minecraft-jogger/repair161/PixelDiagonalIcons.java out/
          cp minecraft-jogger/repair161/MouseAckPolicy.java out/
          cp minecraft-jogger/repair161/ReleaseAndPixelTest.java out/
          cp minecraft-jogger/repair161/ReleaseRoutingSourceTest.java out/
          cp minecraft-jogger/repair162/apply.py out/repair162-apply.py
          cp minecraft-jogger/repair162/PixelDirectionIcons.java out/
          cp minecraft-jogger/repair162/MiningLookPolicy.java out/
          cp minecraft-jogger/repair162/MiningLookAndIconsTest.java out/
          mkdir -p out/verification-tools
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" out/verification-tools/
          grep -q "versionCode='16200'" out/apk-info.txt
          cd out && sha256sum *.apk *.jar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Jogger-1.6.2-Repaired-APK-CI
          path: out/
          retention-days: 90
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/jogger-signing"
