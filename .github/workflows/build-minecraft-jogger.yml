name: Build Minecraft Jogger

on:
  push:
    branches: [minecraft-jogger]
    paths:
      - 'minecraft-jogger/overlay/**'
      - 'minecraft-jogger/build.sh'
      - '.github/workflows/build-minecraft-jogger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native build tools
        run: |
          sdkmanager 'platforms;android-37.0' 'platforms;android-36.1' 'build-tools;37.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Reconstruct pinned source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/AngelAuraMC/Amethyst-Android.git jogger-source
          git -C jogger-source checkout --detach 28d6e12d68121b7dd75f2e841058a6b7cdfe4a29
          git -C jogger-source config submodule.androidnsbypass.url https://github.com/alexytomi/androidnsbypass.git
          git -C jogger-source submodule update --init --recursive
          cp -a minecraft-jogger/overlay/. jogger-source/
          python3 jogger-source/scripts/jogger-prepare.py
          (cd jogger-source && bash scripts/languagelist_updater.sh)
      - name: Prepare build signing
        shell: bash
        env:
          JOGGER_KEYSTORE_BASE64: ${{ secrets.JOGGER_KEYSTORE_BASE64 }}
          JOGGER_SAVED_PASSWORD: ${{ secrets.JOGGER_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/jogger-signing"
          chmod 700 "$RUNNER_TEMP/jogger-signing"
          export JOGGER_KEYSTORE="$RUNNER_TEMP/jogger-signing/jogger.p12"
          if [ -n "$JOGGER_KEYSTORE_BASE64" ] && [ -n "$JOGGER_SAVED_PASSWORD" ]; then
            printf '%s' "$JOGGER_KEYSTORE_BASE64" | base64 --decode > "$JOGGER_KEYSTORE"
            export JOGGER_KEYSTORE_PASSWORD="$JOGGER_SAVED_PASSWORD"
          else
            export JOGGER_KEYSTORE_PASSWORD="$(openssl rand -base64 36)"
            echo "::add-mask::$JOGGER_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$JOGGER_KEYSTORE" -storetype PKCS12 -storepass:env JOGGER_KEYSTORE_PASSWORD -keypass:env JOGGER_KEYSTORE_PASSWORD -alias jogger -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Minecraft Jogger CI Preview, O=Independent launcher, C=PL'
            echo 'This CI APK uses a temporary signing identity; configure repository signing secrets for update-compatible builds.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "JOGGER_KEYSTORE=$JOGGER_KEYSTORE" >> "$GITHUB_ENV"
          echo "JOGGER_KEYSTORE_PASSWORD=$JOGGER_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build APK and test touch agent
        working-directory: jogger-source
        run: |
          gradle --no-daemon --console=plain --max-workers=3 :app_pojavlauncher:assembleRelease :jogger_touch_agent:verifyTouchProtocol
          python3 jogger_touch_agent/tests/agent_socket_test.py "$JAVA_HOME/bin/java" app_pojavlauncher/src/main/assets/components/jogger_touch_agent/jogger_touch_agent.jar jogger_touch_agent/build/classes/java/test
      - name: Verify and package APK
        run: |
          mkdir -p out
          cp jogger-source/app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/Minecraft-Jogger-1.0.0-preview.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs out/Minecraft-Jogger-1.0.0-preview.apk > out/signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging out/Minecraft-Jogger-1.0.0-preview.apk > out/apk-info.txt
          cd out
          sha256sum Minecraft-Jogger-1.0.0-preview.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Jogger-APK
          path: out/
          retention-days: 90
      - name: Clean temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/jogger-signing"
