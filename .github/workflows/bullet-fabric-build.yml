name: Build Bullet (Fabric 1.21.4)
on:
  push:
    branches:
      - bullet-fabric-1.21.4
  workflow_dispatch:
permissions:
  contents: write
jobs:
  jar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Compile and remap Bullet
        run: gradle -p bullet build --no-daemon --stacktrace
      - name: Verify Minecraft actually opens a menu
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 180s xvfb-run -a -s "-screen 0 1280x800x24" gradle -p bullet runClient --no-daemon > /tmp/bullet-startup.log 2>&1 &
          runner_pid=$!
          trap 'kill "$runner_pid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 150); do
            if grep -Fq 'BULLET_MAIN_MENU_READY' /tmp/bullet-startup.log; then
              echo "PASS: Bullet reached a ticking Minecraft menu after renderer initialization."
              exit 0
            fi
            if grep -Eq 'Minecraft Crash Report|Game crashed!|Exception in thread' /tmp/bullet-startup.log; then
              tail -n 120 /tmp/bullet-startup.log
              exit 1
            fi
            if ! kill -0 "$runner_pid" 2>/dev/null; then
              tail -n 120 /tmp/bullet-startup.log
              exit 1
            fi
            sleep 1
          done
          tail -n 120 /tmp/bullet-startup.log
          echo "Client startup test timed out"
          exit 1
      - name: Verify production JAR and Mixin refmap
        run: |
          set -euo pipefail
          JAR=bullet/build/libs/bullet-1.0.2.jar
          test -s "$JAR"
          unzip -l "$JAR" | grep -E 'fabric.mod.json|BulletEntity.class|GameRendererMixin.class'
          unzip -l "$JAR" | grep -F 'client-bullet-refmap.json'
          unzip -p "$JAR" client-bullet-refmap.json > /tmp/client-bullet-refmap.json
          python3 - <<'PY'
          import json
          with open('/tmp/client-bullet-refmap.json') as f:
              refmap = json.load(f)
          print('Found Mixin refmap:', refmap)
          assert refmap.get('mappings') or refmap.get('data'), 'Mixin refmap has no mappings'
          assert 'method_' in str(refmap), 'Expected mapped intermediary method names'
          print('PASS: Mixin name mappings included for production Fabric')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bullet-Fabric-1.21.4-v1.0.2
          path: bullet/build/libs/bullet-1.0.2.jar
          if-no-files-found: error
      - name: Publish JAR as a direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=bullet-fabric-1.21.4-v1.0.2
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" bullet/build/libs/bullet-1.0.2.jar --clobber
          else
            gh release create "$RELEASE" bullet/build/libs/bullet-1.0.2.jar --target "$GITHUB_SHA" --title "Bullet 1.0.2 for Minecraft 1.21.4" --notes "Fabric 1.21.4. Requires Fabric API and Java 21. Craft a Bullet vehicle, enter destination coordinates, experience 720 FOV + shaking, and teleport with the vehicle."
          fi
