name: Build Bezel Motion APK
on:
  push:
    paths:
      - 'bezel-motion/**'
      - '.github/workflows/build-bezel-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile native APK
        run: gradle -p bezel-motion --no-daemon assembleDebug
      - name: Verify package
        run: |
          test -s bezel-motion/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging bezel-motion/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.wiktor.bezelmotion'"
      - name: Publish APK to repository
        run: |
          cp bezel-motion/app/build/outputs/apk/debug/app-debug.apk bezel-motion/BezelMotion.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bezel-motion/BezelMotion.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Bezel Motion APK [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BezelMotion-APK
          path: bezel-motion/BezelMotion.apk
