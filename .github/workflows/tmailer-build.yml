name: Tmailer installers
on:
  push:
    branches: [tmailer-v1.1]
    paths: ['tmailer/**', '.github/workflows/tmailer-build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: windows-x64}
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x64}
          - {os: ubuntu-24.04, platform: linux}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tmailer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build tools
        if: runner.os != 'Linux'
        run: python -m pip install 'pyinstaller>=6.11,<7' 'pywebview>=5.4,<7' 'pillow>=11,<13'
      - name: Set up .NET
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Set up Node for cloud security tests
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud security tests
        if: runner.os == 'Linux'
        run: node --test tests/*.test.mjs
      - name: Protocol and session tests
        run: python -m unittest discover -s tests -v
      - name: Build native installer
        env:
          DOTNET_ROLL_FORWARD: Major
        run: python packaging/build_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: Tmailer-${{ matrix.platform }}
          path: tmailer/release/*
          if-no-files-found: error
  release:
    name: Publish downloads
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view tmailer-v1.3.0 >/dev/null 2>&1; then
            gh release create tmailer-v1.3.0 --target '${{ github.sha }}' --title 'Tmailer 1.3.0' --notes 'Tmailer IMAP, POP3 and SMTP email client. Windows MSI, macOS DMG (Apple silicon and Intel), and Linux DEB. Uses Wiktor Laskowski’s Tmailer logo. Windows and macOS builds are unsigned. The website mail service is configured separately.'
          fi
          gh release upload tmailer-v1.3.0 installers/* --clobber
