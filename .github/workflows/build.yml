name: Build throwing disc mod
on:
  push:
    branches: [throwing-disc-26-3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Check available Java and Fabric versions
        run: |
          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id | startswith("26.")) | .id' | head -25
          curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -E '<version>.*26\\.1' | tail -8
      - name: Compile
        working-directory: throwing-disc-26.3
        run: |
          FABRIC_VERSION=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep '+26.3</version>' | sed 's/.*<version>//;s#</version>.*##' | tail -1)
          echo "Resolved Fabric API version: $FABRIC_VERSION"
          test -n "$FABRIC_VERSION"
          gradle build -Pfabric_version="$FABRIC_VERSION" --stacktrace
      - name: Inspect Minecraft 26.3 renderer API
        shell: bash
        run: |
          echo '=== Candidate Minecraft jars ==='
          find "$HOME/.gradle/caches" -type f -name '*.jar' | grep -Ei 'minecraft.*jar|merged.*jar|26\\.3.*jar' | head -35 || true
          JAR=$(find "$HOME/.gradle/caches" -type f -name '*.jar' | grep -Ei 'minecraft.*26\\.3|minecraft.*merged|merged.*minecraft' | head -1 || true)
          if [[ -z "$JAR" ]]; then
            echo 'Minecraft jar not found; full Fabric Loom jar paths:'
            find "$HOME/.gradle/caches/fabric-loom" -type f -name '*.jar' | head -60 || true
          else
            echo "INSPECTING $JAR"
            for cls in net.minecraft.client.renderer.entity.ThrownItemRenderer net.minecraft.client.renderer.entity.state.ThrownItemRenderState net.minecraft.client.renderer.entity.state.CameraRenderState net.minecraft.client.renderer.item.ItemModelResolver net.minecraft.client.renderer.item.ItemStackRenderState net.minecraft.client.renderer.entity.EntityRenderer net.minecraft.client.renderer.entity.EntityRendererProvider\\$Context net.minecraft.client.renderer.feature.SubmitNodeCollector; do
              echo "=== CLASS $cls ==="
              javap -classpath "$JAR" -p "$cls" | head -95 || true
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: throwing-disc-26.3-jar
          path: throwing-disc-26.3/build/libs/*jar
