name: Build throwing disc mod
on:
  push:
    branches: [throwing-disc-26-3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile
        working-directory: throwing-disc-26.3
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: throwing-disc-26.3-jar
          path: throwing-disc-26.3/build/libs/*jar
