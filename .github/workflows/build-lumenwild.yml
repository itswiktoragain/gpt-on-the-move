name: Build Lumenwild Fabric mod

on:
  push:
    branches:
      - mod/lumenwild-1-21-1
    paths:
      - 'lumenwild/**'
      - '.github/workflows/build-lumenwild.yml'
  pull_request:
    paths:
      - 'lumenwild/**'
      - '.github/workflows/build-lumenwild.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build mod JAR
        working-directory: lumenwild
        run: gradle clean build --stacktrace
      - name: Upload playable JAR
        uses: actions/upload-artifact@v4
        with:
          name: lumenwild-fabric-1.21.1
          path: lumenwild/build/libs/lumenwild-1.0.0.jar
          if-no-files-found: error
