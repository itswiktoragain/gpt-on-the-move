name: Unbound Horizons 29,999,984 Y border safety-margin preview
on:
  push:
    branches: [experimental/unbound-y-world-border]
    paths:
      - 'unbound-horizons/**'
      - '.github/workflows/unbound-worldborder-backend.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build Fabric mod JAR
        working-directory: unbound-horizons
        run: gradle build --no-daemon --console=plain
      - name: Test 30-million-coordinate sparse section storage and persistence
        shell: bash
        working-directory: unbound-horizons
        run: |
          set -eu
          mkdir -p /tmp/uwide-test
          javac -d /tmp/uwide-test \
            src/main/java/dev/wiktor/unboundhorizons/vertical/WideBlockPos.java \
            src/main/java/dev/wiktor/unboundhorizons/vertical/SparseVerticalStore.java \
            src/main/java/dev/wiktor/unboundhorizons/vertical/VerticalWorldBorder.java \
            src/test/java/dev/wiktor/unboundhorizons/vertical/WideStorageSelfTest.java
          java -cp /tmp/uwide-test dev.wiktor.unboundhorizons.vertical.WideStorageSelfTest
      - name: Smoke-test Minecraft server starts with experimental commands
        working-directory: unbound-horizons
        shell: bash
        run: |
          set -eu
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPS'
          max-players=1
          view-distance=2
          simulation-distance=2
          level-type=minecraft:flat
          generate-structures=false
          online-mode=false
          spawn-protection=0
          PROPS
          set +e
          JAVA_TOOL_OPTIONS="-Dunboundhorizons.verifyWideStorage=true -Xmx5G" timeout --signal=INT --kill-after=10s 170s gradle runServer --no-daemon --console=plain > /tmp/unbound-wide-server.log 2>&1
          code=$?
          set -e
          echo "Runner status: $code"
          tail -n 140 /tmp/unbound-wide-server.log
          grep -q 'UNBOUND_WIDE_BACKEND_PASS' /tmp/unbound-wide-server.log
          grep -Eq 'Done \([0-9.,]+s\)!' /tmp/unbound-wide-server.log
          if grep -Eq 'UNBOUND_WIDE_BACKEND_FAIL|Mixin transformation failed|Fatal Exception' /tmp/unbound-wide-server.log; then
            echo "::error::Server runtime smoke-test failed"
            exit 1
          fi
          echo "Experimental wide backend server test passed"
      - name: Upload preview JAR
        uses: actions/upload-artifact@v4
        with:
          name: unboundhorizons-1.21.4-y-border-margin-PREVIEW
          path: unbound-horizons/build/libs/unboundhorizons-0.5.1-preview.jar
          if-no-files-found: error
      - name: Publish preview on experimental branch
        run: |
          mkdir -p unbound-horizons/dist
          cp unbound-horizons/build/libs/unboundhorizons-0.5.1-preview.jar unbound-horizons/dist/unboundhorizons-0.5.1-preview.jar
          git config user.name 'GitHub Actions'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f unbound-horizons/dist/unboundhorizons-0.5.1-preview.jar
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested virtual 30M-Y backend preview [skip ci]'
            git pull --rebase origin experimental/unbound-y-world-border
            git push
          fi
