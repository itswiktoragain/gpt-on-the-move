name: Jogger native dependencies
on:
  push:
    branches: [jogger-independent]
    paths: ['jogger-independent/dependencies.py', 'jogger-independent/bootstrap.py', '.github/workflows/jogger-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;27.3.13750724' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - run: sudo apt-get update -qq && sudo apt-get install -y autoconf automake libtool texinfo cmake ninja-build
      - name: Bootstrap pinned libffi release
        run: python3 jogger-independent/bootstrap.py
      - name: Compile dependencies
        run: |
          set -euo pipefail
          python3 -u jogger-independent/dependencies.py 2>&1 | tee native-build.log
          for abi in arm64-v8a x86_64; do
            test -s "jogger-independent/dependency-output/runtime-$abi.zip"
            for lib in lwjgl lwjgl_opengl lwjgl_stb lwjgl_tinyfd openal mobileglues; do
              test -s "jogger-independent/dependency-output/jniLibs/$abi/lib$lib.so"
            done
          done
          touch jogger-independent/dependency-output/BUILD_COMPLETE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jogger-native-dependencies
          path: |
            jogger-independent/dependency-output/
            native-build.log
          retention-days: 30
