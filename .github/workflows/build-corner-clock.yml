name: Build Corner Clock APK

on:
  push:
    paths:
      - 'bottom-left-clock/**'
      - '.github/workflows/build-corner-clock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable APK
        run: gradle -p bottom-left-clock --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s bottom-left-clock/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging bottom-left-clock/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.wiktor.cornerclock'"
      - name: Publish APK to repository
        run: |
          cp bottom-left-clock/app/build/outputs/apk/debug/app-debug.apk bottom-left-clock/CornerClock.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bottom-left-clock/CornerClock.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build Corner Clock APK [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CornerClock-APK
          path: bottom-left-clock/CornerClock.apk
