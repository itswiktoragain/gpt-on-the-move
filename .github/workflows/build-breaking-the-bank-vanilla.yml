name: Build Breaking the Bank - Vanilla Scratch

on:
  workflow_dispatch:
    inputs:
      swf_url:
        description: 'Optional direct SWF URL if the original Newgrounds mirror is down'
        required: false
        type: string
  push:
    paths:
      - 'breaking-the-bank-scratch/build_vanilla.py'
      - '.github/workflows/build-breaking-the-bank-vanilla.yml'

permissions:
  contents: read

jobs:
  vanilla:
    name: Rebuild native Scratch 3 projects
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 libffi-dev ffmpeg
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'numpy>=1.26,<3' 'CairoSVG>=2.7,<3'
      - name: Obtain the exact uploaded SWF
        shell: bash
        env:
          CUSTOM_SWF_URL: ${{ inputs.swf_url || '' }}
        run: |
          set -euo pipefail
          dest="breaking-the-bank-scratch/457209_Bank_NG.swf"
          expected="dfbd9ae58e9e505aae7d0edb26e7c2aa5d46e63815ccfbcbb8158dc982f7e835"
          if [[ ! -s "$dest" ]]; then
            urls=()
            if [[ -n "$CUSTOM_SWF_URL" ]]; then urls+=("$CUSTOM_SWF_URL"); fi
            urls+=("https://uploads.ungrounded.net/457000/457209_Bank_NG.swf")
            for url in "${urls[@]}"; do
              echo "Fetching original source: $url"
              if curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 90 \
                --user-agent "Mozilla/5.0" "$url" -o "$dest.tmp"; then
                if echo "$expected  $dest.tmp" | sha256sum --check --status; then
                  mv "$dest.tmp" "$dest"
                  break
                fi
              fi
            done
          fi
          if [[ ! -s "$dest" ]] || ! echo "$expected  $dest" | sha256sum --check; then
            echo "::error::SWF missing or checksum mismatch. Supply a direct link on manual trigger or put 457209_Bank_NG.swf in the project directory."
            exit 1
          fi
      - name: Set up renderer paths
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/breaking-the-bank-scratch"
          for py in "$root"/*.py; do
            sed -i \
              -e "s|/mnt/data/bank_port|$root|g" \
              -e "s|/mnt/data/457209_Bank_NG.swf|$root/457209_Bank_NG.swf|g" \
              "$py"
          done
          mkdir -p "$root/assets"
          python -m compileall -q "$root"
      - name: Extract the original soundtrack
        run: python breaking-the-bank-scratch/audio.py
      - name: Render original Flash vector frames
        run: python breaking-the-bank-scratch/rendersheets.py
      - name: Package small vanilla Scratch project (12 FPS)
        run: >-
          python breaking-the-bank-scratch/build_vanilla.py
          --fps 12 --size 192x144
          --output breaking-the-bank-scratch/BreakingTheBank_Vanilla_Compatible.sb3
      - name: Package higher-detail vanilla Scratch project (15 FPS)
        run: >-
          python breaking-the-bank-scratch/build_vanilla.py
          --fps 15 --size 240x180
          --output breaking-the-bank-scratch/BreakingTheBank_Vanilla_Quality.sb3
      - name: Independent standard-Scratch structural verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile
          for p in Path('breaking-the-bank-scratch').glob('BreakingTheBank_Vanilla_*.sb3'):
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  j=json.loads(z.read('project.json'))
                  assert j['extensions']==[] and 'extensionURLs' not in j
                  assert len(j['targets'])==8
                  assert len(j['targets'][0]['sounds'])==7
                  assert all(t['isStage']==(i==0) for i,t in enumerate(j['targets']))
                  assert all(t['size']<=300 for t in j['targets'][1:])
                  assert all(not op['opcode'].startswith('bankstream_')
                             for t in j['targets'] for op in t['blocks'].values())
                  print(p,p.stat().st_size,'bytes',sum(len(t['costumes']) for t in j['targets']),'costumes')
          PY
      - name: Upload compatibility build
        uses: actions/upload-artifact@v4
        with:
          name: BreakingTheBank-Vanilla-Compatible
          path: breaking-the-bank-scratch/BreakingTheBank_Vanilla_Compatible.sb3
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload sharper native-Scratch build
        uses: actions/upload-artifact@v4
        with:
          name: BreakingTheBank-Vanilla-Quality
          path: breaking-the-bank-scratch/BreakingTheBank_Vanilla_Quality.sb3
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
