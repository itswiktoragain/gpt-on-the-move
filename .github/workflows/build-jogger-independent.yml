name: Build independent Minecraft Jogger
on:
  push:
    branches: [jogger-independent]
    paths: ['jogger-independent/**', '.github/workflows/build-jogger-independent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jogger-independent-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native tools
        run: |
          sdkmanager 'ndk;27.3.13750724' 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool texinfo cmake ninja-build
      - uses: actions/cache/restore@v4
        with:
          path: |
            jogger-independent/dependencies
            jogger-independent/dependency-output
            jogger-independent/build-tools-local
          key: jogger-engine-v3-${{ github.run_id }}
          restore-keys: jogger-engine-v3-
      - name: Compile upstream libraries
        run: |
          set -euo pipefail
          python3 jogger-independent/bootstrap.py
          python3 -u jogger-independent/dependencies.py 2>&1 | tee native-build.log
      - name: Compile original engine and agent; run tests
        run: python3 -u jogger-independent/prepare.py 2>&1 | tee prepare.log
      - name: Prepare signing identity
        env:
          SAVED_KEY: ${{ secrets.JOGGER_KEYSTORE_BASE64 }}
          SAVED_PASSWORD: ${{ secrets.JOGGER_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/jogger-signing"
          chmod 700 "$RUNNER_TEMP/jogger-signing"
          export JOGGER_KEYSTORE="$RUNNER_TEMP/jogger-signing/jogger.p12"
          if [ -n "$SAVED_KEY" ] && [ -n "$SAVED_PASSWORD" ]; then
            printf '%s' "$SAVED_KEY" | base64 --decode > "$JOGGER_KEYSTORE"
            export JOGGER_KEYSTORE_PASSWORD="$SAVED_PASSWORD"
          else
            export JOGGER_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
            echo "::add-mask::$JOGGER_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$JOGGER_KEYSTORE" -storetype PKCS12 -storepass:env JOGGER_KEYSTORE_PASSWORD -keypass:env JOGGER_KEYSTORE_PASSWORD -alias jogger -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=Minecraft Jogger Independent Preview, O=Jogger, C=PL'
          fi
          echo "JOGGER_KEYSTORE=$JOGGER_KEYSTORE" >> "$GITHUB_ENV"
          echo "JOGGER_KEYSTORE_PASSWORD=$JOGGER_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: jogger-independent
        env:
          JOGGER_MICROSOFT_CLIENT_ID: ${{ vars.JOGGER_MICROSOFT_CLIENT_ID }}
        run: gradle --no-daemon --max-workers=3 --console=plain :app:assembleRelease :app:assembleDebug 2>&1 | tee ../android-build.log
      - name: Verify APK and preserve source
        run: |
          mkdir -p out
          cp jogger-independent/app/build/outputs/apk/release/app-release.apk out/Minecraft-Jogger-0.3.0-independent.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/Minecraft-Jogger-0.3.0-independent.apk > out/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging out/Minecraft-Jogger-0.3.0-independent.apk > out/apk-info.txt
          cp jogger-independent/app/src/main/assets/jogger-agent.jar out/Jogger-Touch-Agent-0.3.0.jar
          cp jogger-independent/app/src/main/assets/DEPENDENCIES.json out/
          cp jogger-independent/app/src/main/assets/CREDITS.txt out/
          (cd out && sha256sum *.apk *.jar > SHA256SUMS)
          git archive HEAD jogger-independent .github/workflows/build-jogger-independent.yml | gzip > out/Minecraft-Jogger-source.tar.gz
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run Android engine smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash jogger-independent/tests/android-smoke.sh
      - name: Preserve build diagnostics
        if: always()
        run: |
          mkdir -p out/build-logs
          cp native-build.log prepare.log android-build.log out/build-logs/ 2>/dev/null || true
          git rev-parse HEAD > out/COMMIT.txt
          git archive HEAD jogger-independent | gzip > out/Minecraft-Jogger-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Minecraft-Jogger-independent
          path: out/
          retention-days: 90
          compression-level: 0
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            jogger-independent/dependencies
            jogger-independent/dependency-output
            jogger-independent/build-tools-local
          key: jogger-engine-v3-${{ github.run_id }}
      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/jogger-signing"
